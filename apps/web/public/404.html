<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting to UIShelf...</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="refresh" content="0; url=https://sh20raj.github.io/uishelf/" />
    <link rel="canonical" href="https://sh20raj.github.io/uishelf/" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background-color: #08080a;
        color: #f4f4f5;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
      }
      .card {
        background: rgba(18, 18, 22, 0.85);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 20px;
        padding: 40px 32px;
        text-align: center;
        max-width: 440px;
        width: 100%;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 40px rgba(0, 240, 255, 0.1);
        backdrop-filter: blur(16px);
      }
      .glow-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 12px;
        border-radius: 9999px;
        background: rgba(0, 240, 255, 0.1);
        border: 1px solid rgba(0, 240, 255, 0.25);
        color: #00f0ff;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        margin-bottom: 16px;
      }
      h1 {
        font-size: 32px;
        font-weight: 800;
        letter-spacing: -0.5px;
        margin-bottom: 8px;
        background: linear-gradient(135deg, #ffffff 30%, #00f0ff 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      p {
        font-size: 13px;
        color: #a1a1aa;
        line-height: 1.6;
        margin-bottom: 24px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 12px 24px;
        background: #00f0ff;
        color: #000000;
        font-size: 13px;
        font-weight: 700;
        border-radius: 12px;
        text-decoration: none;
        transition: all 0.2s ease;
        box-shadow: 0 0 25px rgba(0, 240, 255, 0.35);
      }
      .btn:hover {
        background: #38f8ff;
        transform: translateY(-1px);
        box-shadow: 0 0 30px rgba(0, 240, 255, 0.5);
      }
    </style>
    <script type="text/javascript">
      // Seamless redirect to https://sh20raj.github.io/uishelf/
      window.location.replace("https://sh20raj.github.io/uishelf/");
    </script>
  </head>
  <body>
    <div class="card">
      <div class="glow-badge">▲ UIShelf</div>
      <h1>Redirecting...</h1>
      <p>Taking you back to the official UIShelf discovery catalog and registry.</p>
      <a href="https://sh20raj.github.io/uishelf/" class="btn">
        Go to UIShelf Home &rarr;
      </a>
    </div>
  </body>
</html>
